<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Płonące Czaszki — komponent</title>
<style>
  :root{
    --bg:#100c14; --bg2:#241a30;
    --ink:#EFE8D9; --ink-soft:#b7a9cc;
    --flame-mid:#ffb020;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
    background:radial-gradient(ellipse at top,var(--bg2) 0%,var(--bg) 65%);
    color:var(--ink); font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;
    padding:40px 20px; overflow-x:hidden;
  }
  .label{
    font-family:"Arial Narrow","Segoe UI Semibold",Arial,sans-serif; font-weight:800;
    letter-spacing:.12em; text-transform:uppercase; font-size:14px; color:var(--ink-soft);
  }
  .count{font-variant-numeric:tabular-nums; color:var(--flame-mid); font-weight:800;}

  /* ---- the track ---- */
  .flame-track{
    display:flex; gap:9px; padding:18px 16px 14px; border-radius:14px;
    background:rgba(0,0,0,.32); box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
    position:relative;
  }
  .flame-pip{
    appearance:none; border:0; background:none; padding:0; margin:0; cursor:pointer;
    width:36px; height:100px; position:relative; display:flex; align-items:flex-end; justify-content:center;
    -webkit-tap-highlight-color:transparent; overflow:visible;
  }
  .flame-pip:focus-visible{ outline:2px solid var(--flame-mid); outline-offset:4px; border-radius:6px; }

  /* ---- the skull — grim, shaded, always present ---- */
  .skull{ position:relative; z-index:2; display:block; overflow:visible; transition:filter .2s ease; }
  .flame-pip:hover .skull{ filter:brightness(1.15); }
  .skull .bone{ stroke:#000; stroke-width:1; }
  .skull .hinge{ fill:none; stroke:rgba(10,6,3,.5); stroke-width:.7; stroke-linecap:round; }
  .skull .brow{ fill:rgba(0,0,0,.55); }
  .skull .browshade{ fill:rgba(0,0,0,.35); }
  .skull .bridge{ fill:rgba(0,0,0,.22); }
  .skull .temple{ fill:rgba(0,0,0,.32); }
  .skull .crack{ fill:none; stroke:rgba(10,6,3,.5); stroke-width:.6; stroke-linecap:round; }
  .skull .socket{ stroke:rgba(0,0,0,.6); stroke-width:.6; }
  .skull .rim{ fill:none; stroke:rgba(210,196,160,.4); stroke-width:.9; }
  .skull .cheek{ fill:rgba(0,0,0,.15); }
  .skull .nose{ stroke:rgba(0,0,0,.5); stroke-width:.6; }
  .skull .cavity{ fill:#0c0805; }
  .skull .teeth rect{ fill:#e4d8b0; stroke:#3a3320; stroke-width:.8; }
  /* eye sockets glow with the same heat-driven color as the flame above */
  .skull .eye-glow{
    fill:var(--eye-c,#ffd27a); opacity:0; filter:blur(.5px);
    transition:opacity .25s ease, fill .4s ease;
  }
  .flame-pip.lit .skull .eye-glow{
    animation:eye-flicker 1.7s ease-in-out infinite; animation-delay:var(--delay-a,0s);
  }
  .flame-pip.lit .skull .bone{
    filter:
      drop-shadow(0 0 calc(1px + var(--heat,0) * 2px) var(--aura-c1,rgba(255,178,40,.6)))
      drop-shadow(0 0 calc(3px + var(--heat,0) * 4px) var(--aura-c2,rgba(190,70,255,.35)));
  }
  @keyframes eye-flicker{
    0%,100%{ opacity:.8; }
    50%{ opacity:1; }
  }

  /* ambient bloom behind the flame — reads as bonfire light spilling out */
  .aura{
    position:absolute; left:50%; bottom:8px; width:54px; height:54px;
    transform:translateX(-50%) scale(.4); border-radius:50%;
    background:radial-gradient(circle,var(--aura-c1,rgba(255,178,40,.5)) 0%,var(--aura-c2,rgba(190,70,255,.4)) 45%,transparent 72%);
    filter:blur(8px); mix-blend-mode:screen; opacity:0;
    transition:opacity .3s ease, background .4s ease;
  }
  .flame-pip.lit .aura{
    animation:aura-pulse 2.6s ease-in-out infinite;
    animation-delay:var(--delay-a,0s);
  }
  /* size + brightness both read --heat (0..1, set on #track from JS = how
     many points are lit / 12) so the glow itself grows with the track */
  @keyframes aura-pulse{
    0%,100%{ transform:translateX(-50%) scale(calc(.72 + var(--heat,0) * .34)); opacity:calc(.4 + var(--heat,0) * .28); }
    50%{ transform:translateX(-50%) scale(calc(1.0 + var(--heat,0) * .62)); opacity:calc(.66 + var(--heat,0) * .3); }
  }

  /* the fire itself — a heat-diffusion simulation drawn on canvas, see JS.
     the canvas fades in on ignite; the shape is never fixed geometry, it's
     redrawn every frame from a rising, cooling field of heat. Sized with
     headroom for the tallest (highest-heat) flame. */
  .flame-canvas{
    position:absolute; left:50%; bottom:0; transform:translateX(-50%);
    width:48px; height:100px; opacity:0; transition:opacity .15s ease;
    pointer-events:none; image-rendering:auto;
  }
  .flame-pip.lit .flame-canvas{ opacity:1; }

  /* one-shot ignition flare — sparked from the top of the skull, also scales with --heat */
  .burst{
    position:absolute; left:50%; bottom:42px; width:8px; height:8px; border-radius:50%;
    transform:translate(-50%,0) scale(0); pointer-events:none;
    background:radial-gradient(circle,
      var(--burst-c1,rgba(255,240,210,.95)) 0%,
      var(--burst-c2,rgba(230,62,122,.6)) 45%,
      var(--burst-c3,rgba(122,31,174,0)) 75%);
    opacity:0;
  }
  .flame-pip.igniting .burst{ animation:burst-out .5s ease-out; }
  @keyframes burst-out{
    0%{ transform:translate(-50%,0) scale(.3); opacity:1; }
    100%{ transform:translate(-50%,0) scale(calc(4 + var(--heat,0) * 4)); opacity:0; }
  }

  @media (prefers-reduced-motion:reduce){
    .aura{ animation:none !important; }
  }

  .hint{ font-size:12px; color:var(--ink-soft); opacity:.75; text-align:center; max-width:340px; }
</style>
</head>
<body>

  <div class="label">Ślad płonących czaszek <span class="count"><span id="lvlNum">0</span>/12</span></div>

  <div class="flame-track" id="track" role="group" aria-label="Ślad płonących czaszek, 12 punktów"></div>

  <div class="hint">Kliknij punkt, żeby zapalić czaszki do niego włącznie. Kliknij ostatnią płonącą, żeby ją zgasić — działa jak suwak.</div>

<script>
(function(){
  const COUNT = 12;
  const track = document.getElementById('track');
  const lvlNum = document.getElementById('lvlNum');
  const DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  const REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let level = 0;

  function rand(min, max){ return min + Math.random() * (max - min); }

  // Same two-stage blend as the fire itself (pale -> vivid warm across the
  // first half, warm -> blue-hot across the second) — used for the ambient
  // glow, eye-glow and ignition flash so the whole component turns blue together.
  function blendStage(base, hot, heat){
    if(heat <= 0.5){
      const d = Math.max(0, 1 - heat / 0.5) * 0.55;
      return base.map(c => Math.round(c + (255 - c) * d));
    }
    const k = (heat - 0.5) / 0.5;
    return base.map((c, i) => Math.round(c + (hot[i] - c) * k));
  }
  function rgba(c, a){ return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }

  /* =======================================================================
     FIRE — a heat-diffusion simulation, the classic technique behind old
     demo-scene / game "fire" effects: a small grid of heat values is
     seeded at the base each frame, drifts and cools as it's copied one row
     higher, and gets mapped to color on the way out. Because the shape
     comes from continuous heat flowing upward — not discrete blobs being
     positioned — the silhouette is a real, unbroken, flickering flame.
     ======================================================================= */
  function makeFire(canvas){
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    const BW = 26, BH = 54;      // low-res heat grid, upscaled with smoothing
    const HMAX = 60;
    const heatGrid = new Float32Array(BW * BH);
    const buf = document.createElement('canvas');
    buf.width = BW; buf.height = BH;
    const bctx = buf.getContext('2d');
    const imgData = bctx.createImageData(BW, BH);
    const data = imgData.data;
    let colRegime = new Array(BW).fill('warm');
    // Regime blobs are driven by a few slowly-drifting anchor points across
    // the width, linearly interpolated — this makes hot/warm patches form as
    // a couple of wide, coherent tongues that morph over time, instead of
    // independent per-column coin-flips (which reads as thin rainbow stripes).
    const RA = 4;
    let regimeAnchor = new Array(RA + 1).fill(0).map(() => Math.random());
    let regimeAnchorVel = new Array(RA + 1).fill(0);
    let lit = false, active = false;
    let heat = 0; // 0..1 — how many points are lit / COUNT

    const dispH = 76 * DPR;         // vertical slice of canvas the flame occupies
    const baseY = h - 42 * DPR;     // bottom of that slice = crown of the (taller) skull
    const dyTop = baseY - dispH;

    // warm-magic palette (low/mid heat): white-gold core -> amber -> magenta -> violet
    function warmAt(t){
      if(t < 0.22) return [255, 246, 214];
      if(t < 0.5){ const k = (t - 0.22) / 0.28; return [255, 246 - 70 * k, 214 - 182 * k]; }
      if(t < 0.78){ const k = (t - 0.5) / 0.28; return [255 - 25 * k, 176 - 114 * k, 32 + 90 * k]; }
      const k = (t - 0.78) / 0.22; return [230 - 108 * k, 62 - 31 * k, 122 + 52 * k];
    }
    // blue-hot palette (high heat): white-blue core -> cyan -> blue -> indigo
    function hotAt(t){
      if(t < 0.22) return [234, 246, 255];
      if(t < 0.5){ const k = (t - 0.22) / 0.28; return [234 - 155 * k, 246 - 30 * k, 255]; }
      if(t < 0.78){ const k = (t - 0.5) / 0.28; return [79 - 37 * k, 216 - 109 * k, 255]; }
      const k = (t - 0.78) / 0.22; return [42 - 16 * k, 107 - 60 * k, 255 - 81 * k];
    }
    // Averaging warm (pink/amber) and hot (cyan/blue) as plain RGB passes
    // through a muddy yellow-green midpoint — near-complementary hues.
    // Instead each COLUMN of the fire commits to a regime, re-rolled when
    // intensity changes, so warm and blue tongues coexist side by side.
    function colorAt(hv, regime){
      const t = 1 - hv / HMAX;
      if(heat <= 0.5){
        const warm = warmAt(t);
        const desat = Math.max(0, 1 - heat / 0.5) * 0.55;
        return [
          warm[0] + (255 - warm[0]) * desat,
          warm[1] + (255 - warm[1]) * desat,
          warm[2] + (255 - warm[2]) * desat
        ];
      }
      return regime === 'hot' ? hotAt(t) : warmAt(t);
    }
    function rollRegimes(){
      const p = heat <= 0.5 ? 0 : (heat - 0.5) / 0.5;
      for(let a = 0; a <= RA; a++){
        regimeAnchorVel[a] += rand(-0.015, 0.015);
        regimeAnchorVel[a] *= 0.92;
        regimeAnchor[a] = Math.min(1, Math.max(0, regimeAnchor[a] + regimeAnchorVel[a]));
      }
      for(let x = 0; x < BW; x++){
        const t = (x / (BW - 1)) * RA;
        const i0 = Math.floor(t), i1 = Math.min(RA, i0 + 1), f = t - i0;
        const v = regimeAnchor[i0] * (1 - f) + regimeAnchor[i1] * f;
        colRegime[x] = v < p ? 'hot' : 'warm';
      }
    }

    // A slow, coherent large-scale sway (like wind nudging the whole flame)
    // layered under fine per-cell turbulence — real fire's motion is mostly
    // this: a few big flowing shapes, not uniform per-pixel noise.
    let swayVel = 0, sway = 0;

    function advance(){
      rollRegimes();
      swayVel += rand(-0.05, 0.05);
      swayVel *= 0.9;
      sway = Math.max(-2.2, Math.min(2.2, sway + swayVel));

      const cx = BW / 2;
      // keep real margin on both sides even at max heat, so the flame
      // always tapers to a point instead of becoming a flat-edged wall
      const activeHalf = Math.max(1.4, (BW / 2) * (0.22 + heat * 0.5));
      // seed the base row — a flat line would look mechanical, so each
      // column gets its own random flicker of heat, softened at its own
      // edges, and blended with its previous value so the base doesn't
      // strobe between frames
      for(let x = 0; x < BW; x++){
        const d = Math.abs(x + 0.5 - cx);
        const edge = d < activeHalf ? 1 - Math.pow(d / activeHalf, 4) : 0;
        const seeded = (lit && edge > 0) ? Math.max(0, (HMAX - rand(0, 6)) * edge) : 0;
        const idx = (BH - 1) * BW + x;
        heatGrid[idx] = heatGrid[idx] * 0.3 + seeded * 0.7;
      }
      // propagate upward: each cell pulls from the cell below — drifting
      // with the shared sway plus a little local jitter — and cools a bit.
      // The result is blended with the cell's own previous value (temporal
      // smoothing) instead of hard-replaced, which is what keeps this from
      // reading as flickering static and makes it read as flowing fire.
      const coolMax = Math.max(1, 3.2 - heat * 1.5);
      for(let y = BH - 1; y >= 1; y--){
        const row = y * BW, rowUp = (y - 1) * BW;
        const swayHere = sway * (1 - y / BH);
        for(let x = 0; x < BW; x++){
          let sx = x + Math.round(swayHere);
          const roll = Math.random();
          if(roll < 0.06) sx -= 2; else if(roll < 0.12) sx += 2;
          else if(roll < 0.4) sx -= 1; else if(roll < 0.74) sx += 1;
          if(sx < 0) sx = 0; else if(sx >= BW) sx = BW - 1;
          const cooled = heatGrid[row + sx] - rand(0, coolMax);
          const newVal = cooled < 0 ? 0 : cooled;
          const idxUp = rowUp + x;
          heatGrid[idxUp] = heatGrid[idxUp] * 0.4 + newVal * 0.6;
        }
      }
    }

    function render(){
      let any = false;
      for(let i = 0; i < BW * BH; i++){
        const hv = heatGrid[i];
        const o = i * 4;
        if(hv <= 1.5){ data[o + 3] = 0; continue; }
        any = true;
        const x = i % BW;
        const c = colorAt(hv, colRegime[x]);
        data[o] = c[0]; data[o + 1] = c[1]; data[o + 2] = c[2];
        data[o + 3] = Math.min(255, Math.pow(hv / HMAX, 0.72) * 255);
      }
      bctx.putImageData(imgData, 0, 0);
      ctx.clearRect(0, 0, w, h);
      ctx.imageSmoothingEnabled = true;
      if('imageSmoothingQuality' in ctx) ctx.imageSmoothingQuality = 'high';
      ctx.filter = 'blur(1.4px)';
      ctx.drawImage(buf, 0, 0, BW, BH, 0, dyTop, w, dispH);
      ctx.filter = 'none';
      return any;
    }

    // Running the heat sim at full 60Hz display refresh reads as frantic,
    // TV-static-like flicker — real flame video, and most game fire effects,
    // update noticeably slower than the screen redraws. Throttle it.
    const SIM_SKIP = 3; // ~20 sim updates/sec at a 60Hz display
    let simTick = 0;
    function step(){
      if(!active) return;
      simTick++;
      if(simTick % SIM_SKIP !== 0) return;
      advance();
      const any = render();
      if(!lit && !any) active = false;
    }

    return {
      setLit(v){
        lit = v;
        if(v){
          active = true;
          if(REDUCED){
            for(let k = 0; k < 30; k++) advance();
            render();
          }
        }
      },
      setHeat(v){
        heat = v;
        rollRegimes();
        if(REDUCED && lit){
          for(let k = 0; k < 6; k++) advance();
          render();
        }
      },
      step
    };
  }

  // A grim, hand-drawn front-facing skull with real bone structure — a
  // dominant rounded braincase, a distinct jaw block with the teeth set
  // back inside a shadowed oral cavity (not glued below a flat edge), a
  // browridge that overhangs the sockets, and weathering (cracks, hollow
  // temple shading). Eye sockets are dark hollows by default; ".eye-glow"
  // ellipses sit exactly over them so the glow never needs separate pixel
  // alignment — it's drawn in the same coordinate space.
  function skullSVG(i){
    const gb = 'bone' + i, gs = 'sock' + i;
    return (
      '<svg class="skull" viewBox="0 0 100 120" width="36" height="43" aria-hidden="true">' +
        '<defs>' +
          '<radialGradient id="' + gb + '" cx="40%" cy="24%" r="85%">' +
            '<stop offset="0%" stop-color="#d3c7a2"/>' +
            '<stop offset="55%" stop-color="#a4956e"/>' +
            '<stop offset="100%" stop-color="#463c26"/>' +
          '</radialGradient>' +
          '<radialGradient id="' + gs + '" cx="50%" cy="14%" r="95%">' +
            '<stop offset="0%" stop-color="#050302"/>' +
            '<stop offset="50%" stop-color="#140f08"/>' +
            '<stop offset="100%" stop-color="#2c2210"/>' +
          '</radialGradient>' +
        '</defs>' +
        // cranium/jaw silhouette — flattened cheeks + squared jaw corner so
        // it doesn't read as a smooth cartoon balloon
        '<path class="bone" fill="url(#' + gb + ')" d="M50,4 C67,4 80,15 82,30 C84,41 81,48 78,54 C80,58 81,62 80,67 C78,76 73,82 66,85 L66,94 C66,100 62,104 50,106 C38,104 34,100 34,94 L34,85 C27,82 22,76 20,67 C19,62 20,58 22,54 C19,48 16,41 18,30 C20,15 33,4 50,4 Z"/>' +
        '<path class="temple" d="M16,32 C13,38 13,45 16,51 C13,44 13,36 17,29 Z"/>' +
        '<path class="temple" d="M84,32 C87,38 87,45 84,51 C87,44 87,36 83,29 Z"/>' +
        '<path class="hinge" d="M77,55 C74,61 70,65 66,67"/>' +
        '<path class="hinge" d="M23,55 C26,61 30,65 34,67"/>' +
        // brow ridge drawn as a bone shelf sitting on the socket's top
        // facet, not a floating cartoon eyebrow arc
        '<path class="brow" d="M23,29.5 L41,26 L45.5,29 L45.5,32 L41,27.5 L24,31 Z"/>' +
        '<path class="brow" d="M77,29.5 L59,26 L54.5,29 L54.5,32 L59,27.5 L76,31 Z"/>' +
        '<path class="browshade" d="M18,32 C21,25 27,20 34,19 C28,21.5 22,26.5 19,34 Z"/>' +
        '<path class="browshade" d="M82,32 C79,25 73,20 66,19 C72,21.5 78,26.5 81,34 Z"/>' +
        '<path class="bridge" d="M48,25 L52,25 L51,44 L49,44 Z"/>' +
        // eye sockets — angular carved facets, not round cartoon holes
        '<path class="socket" fill="url(#' + gs + ')" d="M33,27 L41,26.5 L45.5,32 L45.5,40 L41.5,49 L33.5,54 L26,49.5 L23,41 L25,32 Z"/>' +
        '<path class="socket" fill="url(#' + gs + ')" d="M67,27 L59,26.5 L54.5,32 L54.5,40 L58.5,49 L66.5,54 L74,49.5 L77,41 L75,32 Z"/>' +
        '<path class="rim" d="M25,32 L33,27 L41,26.5"/>' +
        '<path class="rim" d="M75,32 L67,27 L59,26.5"/>' +
        '<path class="crack" d="M64,10 C66,15 63,19 66,24"/>' +
        '<path class="nose" fill="url(#' + gs + ')" d="M50,59 L45,63 L44.5,68 L50,81 L55.5,68 L55,63 Z"/>' +
        '<path class="cheek" d="M24,53 C26,60 30,65 35,67 C29,65 24,60 22,54 Z"/>' +
        '<path class="cheek" d="M76,53 C74,60 70,65 65,67 C71,65 76,60 78,54 Z"/>' +
        '<path class="cavity" d="M34,85 L66,85 L66,93 C66,98 61,102 50,103.5 C39,102 34,98 34,93 Z"/>' +
        '<g class="teeth">' +
          '<rect x="36" y="86" width="4.4" height="10" rx="1"/>' +
          '<rect x="40.6" y="86" width="4.2" height="11" rx="1"/>' +
          '<rect x="45" y="86" width="4" height="8.5" rx="1"/>' +
          '<rect x="50.2" y="86" width="4" height="8.5" rx="1"/>' +
          '<rect x="54.4" y="86" width="4.2" height="11" rx="1"/>' +
          '<rect x="58.8" y="86" width="4.2" height="10" rx="1"/>' +
        '</g>' +
        '<ellipse class="eye-glow" cx="33" cy="42" rx="8.5" ry="11"/>' +
        '<ellipse class="eye-glow" cx="67" cy="42" rx="8.5" ry="11"/>' +
      '</svg>'
    );
  }

  const pips = [];
  const fires = [];
  for(let i = 1; i <= COUNT; i++){
    const btn = document.createElement('button');
    btn.className = 'flame-pip';
    btn.type = 'button';
    btn.setAttribute('aria-pressed', 'false');
    btn.setAttribute('aria-label', 'Punkt ' + i + ' z ' + COUNT);
    btn.style.setProperty('--delay-a', (-rand(0, 2.6)).toFixed(2) + 's');
    btn.innerHTML =
      '<span class="aura"></span>' +
      '<canvas class="flame-canvas" width="' + Math.round(48 * DPR) + '" height="' + Math.round(100 * DPR) + '"></canvas>' +
      '<span class="burst"></span>' +
      skullSVG(i);
    btn.addEventListener('click', () => setLevel(i === level ? i - 1 : i));
    track.appendChild(btn);
    pips.push(btn);
    fires.push(makeFire(btn.querySelector('canvas')));
  }

  function setLevel(v){
    const prev = level;
    level = Math.max(0, Math.min(COUNT, v));
    // global intensity — how full the track is — every flame reads this,
    // not just the one that was just clicked, so the whole row grows or
    // shrinks together as points are added or removed
    const heat = level / COUNT;
    track.style.setProperty('--heat', heat.toFixed(3));
    track.style.setProperty('--aura-c1', rgba(blendStage([255, 178, 40], [210, 240, 255], heat), .5));
    track.style.setProperty('--eye-c', rgba(blendStage([255, 190, 60], [150, 225, 255], heat), 1));
    track.style.setProperty('--aura-c2', rgba(blendStage([190, 70, 255], [60, 140, 255], heat), .4));
    track.style.setProperty('--burst-c1', rgba(blendStage([255, 240, 210], [235, 248, 255], heat), .95));
    const burstMid = blendStage([230, 62, 122], [70, 170, 255], heat);
    track.style.setProperty('--burst-c2', rgba(burstMid, .6));
    track.style.setProperty('--burst-c3', rgba(blendStage([122, 31, 174], [40, 90, 220], heat), 0));
    pips.forEach((p, idx) => {
      const n = idx + 1;
      const wasLit = n <= prev;
      const lit = n <= level;
      p.classList.toggle('lit', lit);
      p.setAttribute('aria-pressed', String(lit));
      fires[idx].setHeat(heat);
      if(lit !== wasLit) fires[idx].setLit(lit);
      if(lit && !wasLit){
        p.classList.remove('igniting'); void p.offsetWidth; p.classList.add('igniting');
        setTimeout(() => p.classList.remove('igniting'), 600);
      }
    });
    lvlNum.textContent = level;
  }

  setLevel(0);

  if(!REDUCED){
    (function loop(){
      fires.forEach(f => f.step());
      requestAnimationFrame(loop);
    })();
  }
})();
</script>
</body>
</html>
